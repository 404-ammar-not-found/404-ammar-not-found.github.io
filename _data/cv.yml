          - Software engineer working on order analytics microservices in Go.
          - Conducted Go benchmarking and pprof CPU and memory profiling to optimise a core microservice, achieving a 4x latency improvement, 3x fewer allocations and a 2x reduction in RSS memory usage.
          - Designed and implemented an HTTP endpoint for an order analytics microservice, handling query parsing, SQL database access and robust error handling, defined through OpenAPI specifications and supporting 700,000 daily requests.
          - Developed unit tests using httptest and validated functionality through Postman-based integration testing.

